<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atmosync.js — Interactive Environmental Atmosphere Playground</title>
  <style>
    :root {
      --atmosync-bg: #1A202C;
      --atmosync-surface: rgba(25, 30, 45, 0.85);
      --atmosync-text: #FFFFFF;
      --atmosync-text-muted: #A0AEC0;
      --atmosync-accent: #63B3ED;
      --atmosync-border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      color: var(--atmosync-text);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      transition: color 0.5s ease;
    }

    header {
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--atmosync-surface);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--atmosync-border);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .tagline {
      font-size: 0.85rem;
      color: var(--atmosync-text-muted);
    }

    .badge {
      background: var(--atmosync-accent);
      color: #000;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 9999px;
    }

    main {
      flex: 1;
      padding: 2rem;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 2rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      z-index: 10;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--atmosync-surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--atmosync-border);
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .card h2 {
      font-size: 1.15rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--atmosync-border);
      padding-bottom: 0.5rem;
    }

    .control-group {
      margin-bottom: 1.25rem;
    }

    .control-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: var(--atmosync-text-muted);
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--atmosync-accent);
    }

    select, button {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border-radius: 0.5rem;
      border: 1px solid var(--atmosync-border);
      background: rgba(0, 0, 0, 0.25);
      color: var(--atmosync-text);
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
    }

    select:focus, button:hover {
      border-color: var(--atmosync-accent);
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .button-grid button {
      font-size: 0.8rem;
      padding: 0.5rem;
      background: rgba(255, 255, 255, 0.05);
    }

    .button-grid button:hover {
      background: var(--atmosync-accent);
      color: #000;
      font-weight: 600;
    }

    pre {
      background: rgba(0, 0, 0, 0.4);
      padding: 1rem;
      border-radius: 0.5rem;
      font-size: 0.82rem;
      font-family: monospace;
      overflow-x: auto;
      max-height: 480px;
      color: #A0AEC0;
      border: 1px solid var(--atmosync-border);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      padding: 0.25rem 0.6rem;
      border-radius: 0.375rem;
      background: rgba(0, 0, 0, 0.2);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #48BB78;
    }

    .palette-swatches {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .swatch {
      flex: 1;
      height: 32px;
      border-radius: 0.35rem;
      border: 1px solid var(--atmosync-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Atmosync.js</h1>
      <span class="badge">v0.1.0</span>
      <span class="tagline">Dynamic Environmental Atmosphere Engine</span>
    </div>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span id="sceneName">Initializing...</span>
    </div>
  </header>

  <main>
    <div class="card">
      <h2>Atmospheric Controls</h2>

      <div class="control-group">
        <label>Presets</label>
        <div class="button-grid">
          <button onclick="setPreset('sunrise')">🌅 Sunrise</button>
          <button onclick="setPreset('sunny-day')">☀️ Sunny Day</button>
          <button onclick="setPreset('cloudy-day')">☁️ Cloudy</button>
          <button onclick="setPreset('rainy-day')">🌧️ Rainy</button>
          <button onclick="setPreset('thunderstorm-day')">⚡ Thunderstorm</button>
          <button onclick="setPreset('golden-sunset')">🌇 Sunset</button>
          <button onclick="setPreset('snowy-night')">❄️ Snowy Night</button>
          <button onclick="setPreset('starry-night')">🌌 Starry Night</button>
        </div>
      </div>

      <div class="control-group">
        <label>Simulated Time (<span id="hourDisplay">14:00</span>)</label>
        <div class="slider-row">
          <input type="range" id="hourSlider" min="0" max="23" value="14" oninput="updateTime(this.value)">
        </div>
      </div>

      <div class="control-group">
        <label>Weather Condition</label>
        <select id="weatherSelect" onchange="updateWeather(this.value)">
          <option value="clear">Clear Sky</option>
          <option value="partly-cloudy">Partly Cloudy</option>
          <option value="cloudy">Overcast / Cloudy</option>
          <option value="fog">Dense Fog</option>
          <option value="drizzle">Gentle Drizzle</option>
          <option value="rain">Rainfall</option>
          <option value="snow">Snowfall</option>
          <option value="thunderstorm">Severe Thunderstorm</option>
        </select>
      </div>

      <div class="control-group">
        <label>Renderer Engine</label>
        <select id="rendererSelect" onchange="switchRenderer(this.value)">
          <option value="canvas">Canvas 2D (Particle Effects)</option>
          <option value="css">CSS Only (Lightweight Gradients)</option>
        </select>
      </div>

      <div class="control-group">
        <label>Animation & Lifecycle</label>
        <div style="display: flex; gap: 0.5rem;">
          <button id="pauseBtn" onclick="togglePause()">Pause Animation</button>
          <button onclick="resetToAuto()">Auto Detect</button>
        </div>
      </div>

      <div class="control-group">
        <label>Active Theme Palette</label>
        <div class="palette-swatches">
          <div id="swatchBg" class="swatch" title="Background">BG</div>
          <div id="swatchSurface" class="swatch" title="Surface">Card</div>
          <div id="swatchAccent" class="swatch" title="Accent">Acc</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Live Environment State & Scene Layers</h2>
      <pre id="stateInspector">Loading...</pre>
    </div>
  </main>

  <script type="module">
    import { Atmosync } from "../dist/index.js";

    let isPaused = false;
    let atmosync = new Atmosync({
      renderer: { type: "canvas", quality: "high" },
      time: { enabled: true, autoUpdate: false },
      location: { enabled: true, autoDetect: true },
      season: { enabled: true, region: "auto" }
    });

    await atmosync.start();

    function refreshInspector() {
      const state = atmosync.getEnvironmentState();
      const scene = atmosync.getCurrentScene();
      const theme = atmosync.getThemePalette();

      document.getElementById("sceneName").innerText = scene.name;
      document.getElementById("stateInspector").innerText = JSON.stringify({
        scene: {
          id: scene.id,
          name: scene.name,
          description: scene.description,
          layers: scene.layers,
        },
        environment: state,
        themePalette: theme,
      }, null, 2);

      if (theme) {
        document.getElementById("swatchBg").style.background = theme.background;
        document.getElementById("swatchSurface").style.background = theme.surface;
        document.getElementById("swatchAccent").style.background = theme.accent;
        document.getElementById("swatchAccent").style.color = "#000";
      }
    }

    atmosync.on("sceneChange", refreshInspector);
    atmosync.on("themeChange", refreshInspector);
    refreshInspector();

    window.setPreset = (sceneId) => {
      atmosync.setScene(sceneId);
    };

    window.updateTime = (hour) => {
      document.getElementById("hourDisplay").innerText = `${hour.toString().padStart(2, "0")}:00`;
      atmosync.resetScene();
      const current = atmosync.getEnvironmentState();
      current.time.hour = parseInt(hour, 10);
      atmosync.emit("timeUpdate", current.time);
      refreshInspector();
    };

    window.updateWeather = (condition) => {
      atmosync.setWeather({ condition });
    };

    window.switchRenderer = (type) => {
      atmosync.destroy();
      atmosync = new Atmosync({
        renderer: { type, quality: "high" },
        time: { enabled: true, autoUpdate: false }
      });
      atmosync.start().then(refreshInspector);
    };

    window.togglePause = () => {
      if (isPaused) {
        atmosync.resume();
        document.getElementById("pauseBtn").innerText = "Pause Animation";
      } else {
        atmosync.pause();
        document.getElementById("pauseBtn").innerText = "Resume Animation";
      }
      isPaused = !isPaused;
    };

    window.resetToAuto = () => {
      atmosync.resetScene();
    };
  </script>
</body>
</html>
